name: Pingo
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    TARGETED_DEVICE_FAMILY: "1,2"
    PINGO_API_BASE_URL: https://api.pingo.invalid/v1
    PINGO_MESSAGE_BASE_URL: https://pingo.invalid/match
packages:
  PingoCore:
    path: ..
targets:
  Pingo:
    type: application.messages
    platform: iOS
    sources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingo.messages
        PRODUCT_NAME: Pingo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Pingo/Info.plist
      properties:
        CFBundleDisplayName: Pingo
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: PingoMessagesExtension
        embed: true
  PingoMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: PingoMessagesExtension
      - path: SharedUI
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingo.messages.extension
        PRODUCT_NAME: Pingo Messages
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PingoMessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: Pingo
        PingoAPIBaseURL: $(PINGO_API_BASE_URL)
        PingoMessageBaseURL: $(PINGO_MESSAGE_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    dependencies:
      - package: PingoCore
      - sdk: Security.framework
      - sdk: StoreKit.framework
schemes:
  Pingo:
    build:
      targets:
        Pingo: all
        PingoMessagesExtension: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Pingo.storekit
    archive:
      config: Release
