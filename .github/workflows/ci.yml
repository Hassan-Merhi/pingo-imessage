name: Pingo CI

on:
  push:
    branches: [main, "phase/**", "wave/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-tests:
    name: Swift core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test PingoCore
        run: swift test --parallel

  backend:
    name: Worker + D1 checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Cloudflare types
        run: npm run types
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Apply D1 migrations locally
        run: npm run migrate:local
      - name: Dry-run Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

  ios-build:
    name: iMessage simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Messages icon variants
        run: bash ios/scripts/generate-imessage-icons.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -project ios/Pingo.xcodeproj
          -scheme Pingo
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
