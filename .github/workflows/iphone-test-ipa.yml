name: Build iPhone Test IPA
# Rebuild marker: Mini Golf Phase 4 match flow validation 2026-08-20

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ios/**
      - Sources/**
      - Package.swift
      - Package.resolved
      - .github/workflows/iphone-test-ipa.yml
  pull_request:
    paths:
      - .github/workflows/iphone-test-ipa.yml

permissions:
  contents: read

jobs:
  build-test-ipa:
    name: Sideload-safe iPhone test IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Messages icon variants
        run: bash ios/scripts/generate-imessage-icons.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Validate privacy manifest
        run: plutil -lint ios/Resources/PrivacyInfo.xcprivacy

      - name: Build unsigned Release device app
        run: |
          set -euo pipefail
          rm -rf build/iphone-test
          xcodebuild \
            -project ios/Pingo.xcodeproj \
            -scheme Pingo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iphone-test/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate sideload-safe bundle layout
        run: |
          set -euo pipefail
          APP_PATH="build/iphone-test/DerivedData/Build/Products/Release-iphoneos/Pingo.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/Pingo Messages.appex"
          test -d "$APP_PATH"
          test -d "$EXTENSION_PATH"

          if find "$APP_PATH" -type f \( -name '*.debug.dylib' -o -name '__preview.dylib' \) | grep -q .; then
            echo "Unexpected Xcode debug-loader dylib found in sideload artifact:" >&2
            find "$APP_PATH" -type f \( -name '*.debug.dylib' -o -name '__preview.dylib' \) >&2
            exit 1
          fi

          /usr/bin/file "$APP_PATH/Pingo" | grep -q 'arm64'
          /usr/bin/file "$EXTENSION_PATH/Pingo Messages" | grep -q 'arm64'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXTENSION_PATH/Info.plist" | grep -Fq 'Pingo_Messages.MessagesViewController'

      - name: Package IPA for personal signing
        run: |
          set -euo pipefail
          APP_PATH="build/iphone-test/DerivedData/Build/Products/Release-iphoneos/Pingo.app"

          rm -rf build/iphone-test/Payload build/iphone-test/Pingo-Test-Release.ipa
          mkdir -p build/iphone-test/Payload
          cp -R "$APP_PATH" build/iphone-test/Payload/Pingo.app

          (cd build/iphone-test && /usr/bin/zip -qry Pingo-Test-Release.ipa Payload)

          test -s build/iphone-test/Pingo-Test-Release.ipa
          /usr/bin/unzip -l build/iphone-test/Pingo-Test-Release.ipa | grep -Fq 'Payload/Pingo.app/PlugIns/Pingo Messages.appex/'
          ! /usr/bin/unzip -l build/iphone-test/Pingo-Test-Release.ipa | grep -E '\.debug\.dylib|__preview\.dylib'

      - name: Upload Pingo test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pingo-Test-Release-IPA-${{ github.run_number }}
          path: build/iphone-test/Pingo-Test-Release.ipa
          if-no-files-found: error
          retention-days: 14
