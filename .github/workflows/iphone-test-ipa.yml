name: Build iPhone Test IPA
# Rebuild marker: Crazy Eights Phase 2 native controls 2026-08-24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ios/**
      - Sources/**
      - Package.swift
      - Package.resolved
      - .github/workflows/iphone-test-ipa.yml
  pull_request:
    paths:
      - .github/workflows/iphone-test-ipa.yml

permissions:
  contents: read

concurrency:
  group: iphone-test-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve package dependencies
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Pingo.xcodeproj -scheme Pingo

      - name: Build unsigned Release device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Pingo.xcodeproj \
            -scheme Pingo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build-iphone.log

      - name: Package test IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Pingo.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/PingoMessagesExtension.appex"

          test -d "$APP_PATH"
          test -d "$EXTENSION_PATH"
          file "$APP_PATH/Pingo" | grep -q 'arm64'
          file "$EXTENSION_PATH/PingoMessagesExtension" | grep -q 'arm64'

          if find "$APP_PATH" -type f \( -name '*.dylib' -o -name '*.framework' \) -print | grep -E 'libswift_Concurrency|libswiftCompatibility|debug|preview' -i; then
            echo "Unexpected debug/loader dylib in Release app bundle" >&2
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Pingo.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Pingo-Test-Release.ipa
          test -s build/Pingo-Test-Release.ipa

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pingo-Test-Release-IPA-${{ github.run_number }}
          path: ios/build/Pingo-Test-Release.ipa
          if-no-files-found: error
          retention-days: 10
