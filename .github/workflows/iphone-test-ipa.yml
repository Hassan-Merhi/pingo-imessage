name: Build iPhone Test IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  pull_request:
    paths:
      - .github/workflows/iphone-test-ipa.yml

permissions:
  contents: read

jobs:
  build-test-ipa:
    name: Unsigned iPhone test IPA
    runs-on: macos-latest
    env:
      CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Debug' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Messages icon variants
        run: bash ios/scripts/generate-imessage-icons.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Validate privacy manifest
        run: plutil -lint ios/Resources/PrivacyInfo.xcprivacy

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build/iphone-test
          xcodebuild \
            -project ios/Pingo.xcodeproj \
            -scheme Pingo \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iphone-test/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA for AltServer
        run: |
          set -euo pipefail
          APP_PATH="build/iphone-test/DerivedData/Build/Products/${CONFIGURATION}-iphoneos/Pingo.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/Pingo Messages.appex"
          test -d "$APP_PATH"
          test -d "$EXTENSION_PATH"

          rm -rf build/iphone-test/Payload build/iphone-test/Pingo-Test.ipa
          mkdir -p build/iphone-test/Payload
          cp -R "$APP_PATH" build/iphone-test/Payload/Pingo.app

          # This IPA is intentionally unsigned. AltServer/AltStore will apply the
          # user's personal-development signature and provisioning profile later.
          (cd build/iphone-test && /usr/bin/zip -qry Pingo-Test.ipa Payload)

          test -s build/iphone-test/Pingo-Test.ipa
          /usr/bin/unzip -l build/iphone-test/Pingo-Test.ipa | grep -Fq 'Payload/Pingo.app/PlugIns/Pingo Messages.appex/'

      - name: Upload Pingo test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pingo-Test-IPA-${{ github.run_number }}
          path: build/iphone-test/Pingo-Test.ipa
          if-no-files-found: error
          retention-days: 14
